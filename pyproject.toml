[project]
name = "triptych"
version = "0.1.0"
description = "One option priced three ways: closed form, binomial tree and Monte Carlo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
]

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "ruff==0.14.6",
    "mypy==1.18.2",
    "scipy-stubs==1.16.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triptych"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D413", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
